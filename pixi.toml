[workspace]
name = "amorphouspy"
channels = ["conda-forge"]
platforms = [
    { platform = "linux-64" },
    { platform = "osx-arm64", macos = "14.0" },
    { platform = "osx-64", macos = "14.0" }
]


[dependencies]
python = "3.13.*"
hatchling = "*"
ase = "*"
jupyter = "*"
lammpsparser = ">=0.0.7"
lammps = { version = "==2024.08.29", build = "*_openmpi_*" }
networkx = "*"
numba = "*"
numpy = "*"
pandas = "*"
pydantic = "*"
pymatgen = "*"
scipy = "*"

[pypi-dependencies]
amorphouspy = { path = ".", editable = true }
PyMCubes = "*"

[feature.dev.dependencies]
pre-commit = "*"
ruff = ">=0.12.0"
pytest = "*"
pytest-cov = "*"
nbval = "*"
pip-licenses = "*"
ty = ">=0.0.29,<0.0.30"

[feature.api.dependencies]
executorlib = ">=1.10"
h5py = "*"
pysqa = "*"
sqlalchemy = "*"
uvicorn = "*"
jinja2 = "*"

[feature.api.pypi-dependencies]
fastapi = "*"
mcp = ">=1.6.0"

[feature.api.target.linux-64.dependencies]
flux-core = ">=0.81.0"

[feature.docs.dependencies]
mkdocs-material = "*"
mkdocs-jupyter = "==0.24.8"
mkdocs-include-markdown-plugin = "*"
pymdown-extensions = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"

[feature.docs.pypi-dependencies]
mkdocs-swagger-ui-tag = ">=0.8.0, <0.9"

[environments]
default = { features = ["dev", "docs", "api"], solve-group = "default" }
docs = { features = ["docs", "api"], solve-group = "default" }

[tasks]
test-lib = { cmd = "python -m pytest src/tests --durations=0 --cov=src/amorphouspy --cov-report=xml --cov-report=term", cwd = "amorphouspy" }
test-api = { cmd = "pytest --durations=0 --cov=src/amorphouspy_api --cov-report=xml --cov-report=term", cwd = "amorphouspy_api" }
test-notebooks = { cmd = "pytest --durations=0 --nbval-lax ../notebooks/*ipynb --cov=$(pwd)/src/amorphouspy --cov-report=term --cov-report=xml --cov-append", cwd = "amorphouspy" }
# Re-execute notebooks in place. With no argument all notebooks are run; pass a
# path or glob to pick one, e.g. `pixi run run-notebooks notebooks/ViscosityTutorial.ipynb`.
run-notebooks = { cmd = "jupyter nbconvert --to notebook --execute --inplace {{ notebook }}", args = [{ arg = "notebook", default = "notebooks/*.ipynb" }] }
serve = "uvicorn amorphouspy_api.app:app --host 0.0.0.0 --port 8000 --log-level info --backlog 1 --timeout-keep-alive 60"
lint = "ruff check --output-format=github"
format-check = "ruff format --check --diff"
typecheck = "ty check amorphouspy_api/src/amorphouspy_api/ amorphouspy/src/amorphouspy/"
generate-openapi = "python docs/export_openapi.py"
docs-build = { depends-on = ["generate-openapi"], cmd = "mkdocs build --strict" }
docs-serve = "mkdocs serve"
# Ignored packages: lammps (GPL, external subprocess only — not a combined work),
# matplotlib-inline (BSD-3-Clause, misreported as UNKNOWN by pip-licenses)
license-check = "pip-licenses --partial-match --allow-only='MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL;Mozilla;Unlicense;Public Domain;HPND;LGPL' --fail-on='GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2);GNU General Public License (GPL)' -i UNKNOWN amorphouspy amorphouspy-api lammps matplotlib-inline --format=plain"
