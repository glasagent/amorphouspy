name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-title-escapes: '\<*_&'

autolabeler:
  - label: 'feature'
    branch:
      - '/^feat\/.+/'
  - label: 'bug'
    branch:
      - '/^fix\/.+/'
  - label: 'documentation'
    branch:
      - '/^docs\/.+/'
  - label: 'refactor'
    branch:
      - '/^refactor\/.+/'
      - '/^style\/.+/'
  - label: 'ci'
    branch:
      - '/^ci\/.+/'
      - '/^chore\/.+/'
  - label: 'enhancement'
    branch:
      - '/^perf\/.+/'
  - label: 'dependencies'
    branch:
      - '/^test\/.+/'

categories:
  - title: '💥 Breaking Changes'
    labels: ['breaking']
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug']
  - title: '📚 Documentation'
    labels: ['documentation', 'docs']
  - title: '🔧 Maintenance'
    labels: ['dependencies', 'ci', 'refactor']

version-resolver:
  major:
    labels: ['breaking', 'major']
  minor:
    labels: ['feature', 'enhancement', 'minor']
  patch:
    labels: ['bug', 'patch']
  default: patch

exclude-labels:
  - 'skip-changelog'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
