name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-title-escapes: '\<*_&'

autolabeler:
  - label: 'type: feature'
    branch:
      - '/^feat\/.+/'
      - '/^perf\/.+/'
  - label: 'type: bug'
    branch:
      - '/^fix\/.+/'
  - label: 'type: documentation'
    branch:
      - '/^docs\/.+/'
  - label: 'type: refactor'
    branch:
      - '/^refactor\/.+/'
      - '/^style\/.+/'
  - label: 'type: ci'
    branch:
      - '/^ci\/.+/'
      - '/^chore\/.+/'
  - label: 'type: tests'
    branch:
      - '/^test\/.+/'
  - label: 'type: dependencies'
    branch:
      - '/^dep\/.+/'
      - '/^deps\/.+/'

categories:
  - title: '💥 Breaking Changes'
    labels: ['type: breaking']
  - title: '🚀 Features'
    labels: ['type: feature']
  - title: '🐛 Bug Fixes'
    labels: ['type: bug']
  - title: '📚 Documentation'
    labels: ['type: documentation']
  - title: '🔧 Maintenance'
    labels: ['type: dependencies', 'type: ci', 'type: refactor', 'type: tests']

version-resolver:
  major:
    labels: ['type: breaking', 'semver: major']
  minor:
    labels: ['type: feature', 'semver: minor']
  patch:
    labels: ['type: bug', 'semver: patch']
  default: patch

exclude-labels:
  - 'skip-changelog'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
